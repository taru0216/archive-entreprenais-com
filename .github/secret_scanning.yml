# crawl したミラー（他組織の公開 HTML の生コピー）の中の、他組織が公開 HTML にそのまま載せている API key（Google Maps / YouTube など）は、
# このリポジトリの credential ではなく、失効もできない。crawl のたびに alert が増えるので、ミラーの path を secret scanning の対象から外す。
# 自組織の秘密を置くディレクトリ（scripts/・tests/・.claude/・.github/ など）は対象のまま。
paths-ignore:
  - "jp/**"
  - "docs/**"
  - "me/**"
