name: Crawl Marche

# 自治体公式サイト・道の駅の農業・マルシェ関連ページを自動クロールしてアーカイブする。
# crawl_marche.py の 2 ステップ（gen-csv + save-html）を週次で自動実行する。
#
# アーキテクチャ:
#   shard ジョブ: shard_targets.py で target_csv を自治体ドメインごとに分割し matrix JSON を生成
#   crawl ジョブ: matrix 並列（max-parallel: 20）で各自治体を crawl_marche.py でクロール
#
# 毎週月曜 02:00 JST（= 日曜 17:00 UTC）に自動起動。
# public リポジトリのため GitHub hosted runner を使用する。

on:
  schedule:
    - cron: "0 17 * * 0"  # 毎週日曜 UTC 17:00 = 月曜 02:00 JST
  workflow_dispatch:
    inputs:
      target_csv:
        description: "自治体リスト CSV パス"
        required: false
        default: ".data/crawl-targets/marche-targets.csv"
      depth:
        description: "BFS 探索深さ上限"
        required: false
        default: "1"
      sleep:
        description: "リクエスト間 sleep 秒"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: "crawl-marche-${{ github.event.inputs.target_csv || '.data/crawl-targets/marche-targets.csv' }}"
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      target_csv: ${{ steps.resolve.outputs.target_csv }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target CSV path
        id: resolve
        run: |
          TARGET="${{ github.event.inputs.target_csv || '.data/crawl-targets/marche-targets.csv' }}"
          echo "target_csv=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Generate shard matrix
        id: gen
        run: |
          # --group-by-domain: 同一 FQDN の自治体を同一シャードに集約
          # marche-targets.csv の各行は異なる自治体ドメインなので 1 自治体 1 シャードになる
          python3 scripts/shard_targets.py \
            --csv "${{ steps.resolve.outputs.target_csv }}" \
            --group-by-domain \
            --output-json

  crawl:
    needs: shard
    if: needs.shard.outputs.matrix != '{"include":[]}'
    strategy:
      matrix: ${{ fromJson(needs.shard.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Python version
        run: python3 --version

      - name: "Step① gen-csv: shard ${{ matrix.shard_id }} (domain=${{ matrix.domain }})"
        id: gen_csv
        run: |
          DEPTH="${{ github.event.inputs.depth || '1' }}"
          SLEEP="${{ github.event.inputs.sleep || '3' }}"
          TARGET_CSV="${{ needs.shard.outputs.target_csv }}"

          python3 scripts/crawl_marche.py gen-csv \
            --target-csv "${TARGET_CSV}" \
            --target-domain "${{ matrix.domain }}" \
            --out ".data/crawl-targets/marche-pages-shard-${{ matrix.shard_id }}.csv" \
            --depth "${DEPTH}" \
            --sleep "${SLEEP}"

      - name: "Commit discovery CSV (shard ${{ matrix.shard_id }})"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".data/crawl-targets/marche-pages-shard-${{ matrix.shard_id }}.csv"
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "chore(marche): discovery CSV shard-${{ matrix.shard_id }} (${{ matrix.domain }}) を更新 [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || {
                echo "push attempt ${attempt} failed, retrying..."
                sleep $((attempt * 5))
              }
            done
          fi

      - name: "Step② save-html: shard ${{ matrix.shard_id }} (domain=${{ matrix.domain }})"
        id: save_html
        run: |
          SLEEP="${{ github.event.inputs.sleep || '3' }}"
          SHARD_CSV=".data/crawl-targets/marche-pages-shard-${{ matrix.shard_id }}.csv"

          # shard CSV が存在しない場合はスキップ
          if [ ! -f "${SHARD_CSV}" ]; then
            echo "[save-html] ${SHARD_CSV} が存在しません — スキップ"
            echo "pages_saved=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/crawl_marche.py save-html \
            --csv "${SHARD_CSV}" \
            --sleep "${SLEEP}"

      - name: "Commit & push HTML archive (shard ${{ matrix.shard_id }})"
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi

          COUNT=$(git diff --cached --name-only | grep "index\.html" | wc -l | tr -d ' ')
          git commit -m "[bot] marche crawl ${TODAY} shard-${{ matrix.shard_id }} (${{ matrix.domain }}) (${COUNT} pages)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || {
              echo "push attempt ${attempt} failed, retrying..."
              sleep $((attempt * 5))
            }
          done

      - name: Summary
        if: always()
        run: |
          echo "## Crawl Marche — shard ${{ matrix.shard_id }} (${{ matrix.domain }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| domain | ${{ matrix.domain }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pages_saved | ${{ steps.save_html.outputs.pages_saved || 0 }} |" >> $GITHUB_STEP_SUMMARY
