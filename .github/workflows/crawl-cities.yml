name: Crawl Cities

# 自治体公式サイトの農業・産業関連ページを自動クロールしてアーカイブする。
# crawl_cities.py の CitySpider（1ステップ）で週次自動実行する。
# 収集した cities データは marche ページの build 等、複数の用途に利用される。
#
# アーキテクチャ:
#   shard ジョブ: shard_targets.py で target_csv を自治体ドメインごとに分割し matrix JSON を生成
#   crawl ジョブ: matrix 並列（max-parallel: 20）で各自治体を crawl_cities.py 1コマンドでクロール
#
# 毎週月曜 02:00 JST（= 日曜 17:00 UTC）に自動起動。
# public リポジトリのため GitHub hosted runner を使用する。

on:
  schedule:
    - cron: "0 17 * * 0"  # 毎週日曜 UTC 17:00 = 月曜 02:00 JST
  workflow_dispatch:
    inputs:
      target_csv:
        description: "自治体リスト CSV パス"
        required: false
        default: ".data/crawl-targets/marche-targets.csv"
      max_age_days:
        description: "TTL（日数）: この日数より古い場合のみ再クロール"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: "crawl-cities-${{ github.event.inputs.target_csv || '.data/crawl-targets/marche-targets.csv' }}"
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      target_csv: ${{ steps.resolve.outputs.target_csv }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target CSV path
        id: resolve
        run: |
          TARGET="${{ github.event.inputs.target_csv || '.data/crawl-targets/marche-targets.csv' }}"
          echo "target_csv=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Generate shard matrix
        id: gen
        run: |
          # --group-by-domain: 同一 FQDN の自治体を同一シャードに集約
          # 各行は異なる自治体ドメインなので 1 自治体 1 シャードになる
          python3 scripts/shard_targets.py \
            --csv "${{ steps.resolve.outputs.target_csv }}" \
            --group-by-domain \
            --output-json

  crawl:
    needs: shard
    if: needs.shard.outputs.matrix != '{"include":[]}'
    strategy:
      matrix: ${{ fromJson(needs.shard.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Python version
        run: python3 --version

      - name: Install Scrapy
        run: pip install scrapy --quiet

      - name: "Crawl city (1ステップ): shard ${{ matrix.shard_id }} (domain=${{ matrix.domain }})"
        id: crawl
        run: |
          MAX_AGE="${{ github.event.inputs.max_age_days || '7' }}"
          TARGET_CSV="${{ needs.shard.outputs.target_csv }}"

          python3 scripts/crawl_cities.py \
            --target-csv "${TARGET_CSV}" \
            --target-domain "${{ matrix.domain }}" \
            --max-age-days "${MAX_AGE}"

      - name: "Commit & push HTML archive (shard ${{ matrix.shard_id }})"
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi

          COUNT=$(git diff --cached --name-only | grep "index\.html" | wc -l | tr -d ' ')
          git commit -m "[bot] cities crawl ${TODAY} shard-${{ matrix.shard_id }} (${{ matrix.domain }}) (${COUNT} pages)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || {
              echo "push attempt ${attempt} failed, retrying..."
              sleep $((attempt * 5))
            }
          done

      - name: Summary
        if: always()
        run: |
          echo "## Crawl Cities — shard ${{ matrix.shard_id }} (${{ matrix.domain }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| domain | ${{ matrix.domain }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pages_saved | ${{ steps.crawl.outputs.pages_saved || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pages_skipped | ${{ steps.crawl.outputs.pages_skipped || 0 }} |" >> $GITHUB_STEP_SUMMARY
